<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portrait Background Removal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#c8c8c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px}
h1{color:#9df7cb;font-size:1.4rem;margin-bottom:6px}
.sub{color:#666;font-size:.85rem;margin-bottom:24px}
#drop{width:100%;max-width:700px;border:2px dashed #333;border-radius:12px;padding:60px 20px;text-align:center;cursor:pointer;transition:border-color .2s}
#drop:hover,#drop.over{border-color:#9df7cb}
#drop p{color:#888;font-size:.95rem}
#drop input{display:none}
#status{margin:20px 0;color:#9df7cb;font-size:.9rem;min-height:24px;text-align:center}
.bar-wrap{width:300px;height:4px;background:#222;border-radius:2px;margin:8px auto;overflow:hidden}
.bar{height:100%;background:#9df7cb;width:0;transition:width .3s}
#results{display:none;text-align:center;margin-top:16px}
#results canvas{max-width:90vw;max-height:65vh;border:1px solid #222;border-radius:4px;margin-bottom:16px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{background:#9df7cb;color:#0a0a0a;border:none;padding:10px 24px;font-size:.9rem;font-weight:700;border-radius:6px;cursor:pointer;transition:background .15s}
button:hover{background:#b5fcd8}
button.sec{background:#222;color:#9df7cb;border:1px solid #333}
button.sec:hover{background:#333}
small{display:block;margin-top:16px;color:#555;font-size:.78rem}
</style>
</head>
<body>
<h1>Portrait Background Removal</h1>
<p class="sub">AI-powered — runs entirely in your browser (no upload to server)</p>

<div id="drop">
  <p>Drop your portrait JPEG here, or click to select</p>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div id="status"></div>
<div class="bar-wrap" id="barWrap" style="display:none"><div class="bar" id="bar"></div></div>

<div id="results">
  <canvas id="canvas"></canvas>
  <div class="btns">
    <button id="download">Download PNG</button>
    <button id="copyPath">Copy Path</button>
    <button class="sec" id="retry">Process Another</button>
  </div>
  <small>Save as: <code>public/ashwin-cutout.png</code></small>
</div>

<script type="module">
const drop=document.getElementById('drop'),fileInput=document.getElementById('fileInput'),
  status=document.getElementById('status'),barWrap=document.getElementById('barWrap'),
  bar=document.getElementById('bar'),results=document.getElementById('results'),
  canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');

let blob=null;

drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');
  if(e.dataTransfer.files.length)process(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)process(e.target.files[0])});

async function process(file){
  drop.style.display='none';results.style.display='none';
  status.textContent='Loading AI model (~84MB, first time only)...';
  barWrap.style.display='';bar.style.width='0%';

  try{
    const{removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.15/+esm');
    status.textContent='Analyzing portrait...';
    const imgBlob=new Blob([await file.arrayBuffer()],{type:file.type});

    blob=await removeBackground(imgBlob,{
      progress:(key,current,total)=>{
        if(total>0){
          const pct=Math.round(current/total*100);
          bar.style.width=pct+'%';
          if(key.includes('fetch'))status.textContent=`Downloading model: ${pct}%`;
          else status.textContent=`Processing: ${pct}%`;
        }
      }
    });

    status.textContent='Done!';
    bar.style.width='100%';

    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      canvas.width=img.width;canvas.height=img.height;
      ctx.clearRect(0,0,img.width,img.height);
      ctx.drawImage(img,0,0);
      results.style.display='';
      status.textContent=`Result: ${img.width}×${img.height}px — transparent PNG`;
    };
    img.src=url;
  }catch(err){
    status.textContent='Error: '+err.message;
    console.error(err);
    drop.style.display='';
  }
}

document.getElementById('download').addEventListener('click',()=>{
  if(!blob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ashwin-cutout.png';
  a.click();
});

document.getElementById('copyPath').addEventListener('click',()=>{
  navigator.clipboard.writeText('public/ashwin-cutout.png').then(()=>{});
});

document.getElementById('retry').addEventListener('click',()=>{
  results.style.display='none';drop.style.display='';
  status.textContent='';bar.style.width='0%';barWrap.style.display='none';
  fileInput.value='';blob=null;
});
</script>
</body>
</html>
